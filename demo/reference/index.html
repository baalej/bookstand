<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bookstand vs StPageFlip — drag comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #d8d4cd;
        color: #2a2724;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header { padding: 8px 12px; display: flex; gap: 16px; align-items: center; }
      .books { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 0; }
      .cell { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
      .cell h2 { margin: 0; padding: 6px 12px; font-size: 12px; font-weight: 600; opacity: 0.6; }
      .mount { min-height: 0; position: relative; }
      /* StPageFlip needs real <img> children inside .page elements. */
      #stpf-src { display: none; }
      .page img { width: 100%; height: 100%; display: block; }
      .page { background: #fff; }
      #trace {
        position: fixed; right: 8px; bottom: 8px; width: 320px; max-height: 45vh;
        overflow: auto; background: #0008; color: #fff; padding: 8px;
        border-radius: 6px; white-space: pre; font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>drag both. left = reference, right = ours</strong>
      <button id="reset">reset</button>
      <label><input type="checkbox" id="trace-on" /> trace</label>
    </header>

    <div class="books">
      <div class="cell">
        <h2>StPageFlip 2.0.7 (reference)</h2>
        <div class="mount"><div id="stpf"></div></div>
      </div>
      <div class="cell">
        <h2>Bookstand (ours)</h2>
        <div class="mount"><div id="ours" tabindex="0" style="width:100%;height:100%"></div></div>
      </div>
    </div>

    <div id="stpf-src">
      <div class="page" data-density="hard"><img src="/cover.jpg" /></div>
      <div class="page"><img src="/page_1.jpg" /></div>
      <div class="page"><img src="/page_2.jpg" /></div>
      <div class="page"><img src="/page_3.jpg" /></div>
      <div class="page"><img src="/page_4.jpg" /></div>
      <div class="page"><img src="/page_5.jpg" /></div>
      <div class="page"><img src="/page_6.jpg" /></div>
      <div class="page" data-density="hard"><img src="/backcover.jpg" /></div>
    </div>

    <pre id="trace" hidden></pre>

    <script src="./vendor/page-flip.browser.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
