<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bookstand — Phase 2</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #d8d4cd;
        --ink: #2a2724;
      }
      @media (prefers-color-scheme: dark) {
        :root { --surface: #17161a; --ink: #e8e4dd; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
      #stage {
        flex: 1;
        min-height: 0;
        /* The book reserves its full spread footprint, so nothing here shifts
           when the cover opens. */
        display: block;
        outline: none;
      }
      #stage:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 40%, transparent); }
      footer {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.35; cursor: default; }
      #status { font-variant-numeric: tabular-nums; opacity: 0.7; min-width: 15ch; text-align: center; }
    </style>
  </head>
  <body>
    <div id="stage" tabindex="0"></div>
    <footer>
      <button id="prev">← Prev</button>
      <span id="status"></span>
      <button id="next">Next →</button>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
