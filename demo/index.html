<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bookstand — Parameters</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #d8d4cd;
        --ink: #2a2724;
        --panel: #ecebe7;
        --line: color-mix(in srgb, var(--ink) 12%, transparent);
        --accent: #b4542d;
      }
      @media (prefers-color-scheme: dark) {
        :root { --surface: #17161a; --ink: #e8e4dd; --panel: #212025; --accent: #e08a5f; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 0;
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      body.panel-open { grid-template-columns: minmax(0, 1fr) 320px; }
      main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }

      /* ---- parameter panel ---- */
      #panel {
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow: auto;
        overscroll-behavior: contain;
        font-size: 12px;
        visibility: hidden;
      }
      body.panel-open #panel { visibility: visible; }
      #panel header {
        position: sticky; top: 0; z-index: 1;
        display: flex; align-items: center; gap: 8px;
        padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
      }
      #panel header strong { font-size: 13px; }
      #panel .hint { flex: 1; opacity: 0.55; }
      #panel details { border-bottom: 1px solid var(--line); }
      #panel summary { padding: 10px 14px; cursor: pointer; font-weight: 600; user-select: none; }
      #panel fieldset { border: 0; margin: 4px 0 8px; padding: 0; }
      #panel legend { padding: 4px 14px 2px; font-weight: 600; opacity: 0.6; text-transform: lowercase; }
      #panel .row {
        display: grid; grid-template-columns: 96px minmax(0, 1fr) 20px; align-items: center; gap: 6px;
        padding: 3px 10px 3px 14px;
      }
      #panel .row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.8; }
      #panel .row.rebuilds label::after { content: ' ↻'; opacity: 0.5; }
      #panel .row.changed label { color: var(--accent); opacity: 1; font-weight: 600; }
      #panel .reset { visibility: hidden; padding: 0; border: 0; width: 20px; height: 20px; opacity: 0.6; }
      #panel .row.changed .reset { visibility: visible; }
      #panel .num { display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 6px; align-items: center; }
      #panel .vector { display: grid; gap: 2px; }
      #panel .sub { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 4px; }
      #panel .axis { opacity: 0.55; }
      #panel .close { display: none; padding: 2px 9px; font-size: 16px; line-height: 1; }
      #panel input[type='range'] { width: 100%; margin: 0; accent-color: var(--accent); }
      #panel input[type='number'], #panel select {
        width: 100%; font: inherit; font-variant-numeric: tabular-nums; padding: 2px 4px;
        border: 1px solid var(--line); border-radius: 5px; background: transparent; color: inherit;
      }
      #panel input[type='checkbox'] { justify-self: start; accent-color: var(--accent); }
      #panel .out-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; }
      #panel pre {
        margin: 0 14px 16px; padding: 10px; border-radius: 6px; border: 1px solid var(--line);
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
        user-select: all;
      }
      @media (max-width: 820px) {
        body, body.panel-open { grid-template-columns: minmax(0, 1fr) 0; }
        #panel {
          position: fixed; inset: 0 0 0 auto; width: min(340px, 100vw); z-index: 10;
          box-shadow: -12px 0 32px rgb(0 0 0 / 0.18);
        }
        #panel .close { display: inline-block; }
      }
      #stage {
        flex: 1;
        min-height: 0;
        /* The book reserves its full spread footprint, so nothing here shifts
           when the cover opens. */
        display: block;
        outline: none;
      }
      #stage:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 40%, transparent); }
      footer {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.35; cursor: default; }
      #status { font-variant-numeric: tabular-nums; opacity: 0.7; min-width: 15ch; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage" tabindex="0"></div>
      <footer>
        <button id="prev">← Prev</button>
        <span id="status"></span>
        <button id="next">Next →</button>
        <button id="panel-toggle" aria-controls="panel">Parameters</button>
      </footer>
    </main>
    <aside id="panel" aria-label="Parameters"></aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
